<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeWorld</title>
<style>
:root{--bg:#080a0f;--side:#0d1117;--panel:#0b0f14;--line:#232a35;--text:#d7dde8;--muted:#7e8999;--blue:#62a8ff;--green:#9be28f;--yellow:#ffd580;--red:#ff6b78;--cyan:#72d5e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.top{height:48px;display:flex;align-items:center;gap:14px;padding:0 14px;background:#0b0e13;border-bottom:1px solid var(--line)}.logo{font-weight:900;font-size:18px}.logo b{color:var(--yellow)}.path{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 48px)}aside{background:var(--side);border-right:1px solid var(--line)}.head{padding:13px;color:var(--muted);font-size:11px;letter-spacing:.12em}.file{width:100%;min-height:42px;border:0;border-left:2px solid transparent;background:transparent;color:#adb7c5;text-align:left;padding:8px 12px;font:12px inherit;cursor:pointer}.file:hover{background:#151a22}.file.active{background:#171c24;border-left-color:var(--blue);color:#fff}.file span{color:var(--yellow);margin-right:8px}main{min-width:0}.tab{height:38px;display:flex;align-items:center;padding:0 14px;background:#0b0f14;border-bottom:1px solid var(--line);font-size:12px}.tab span{color:var(--yellow);margin-right:7px}.lesson{padding:15px 17px;border-bottom:1px solid var(--line)}.comment{color:#6a9955;font-size:12px}.title{font-size:19px;font-weight:800;margin:5px 0}.desc{font-family:system-ui,sans-serif;color:#aab3c1;font-size:14px;line-height:1.5}.task{color:var(--cyan);font-size:12px;margin-top:10px}.editorWrap{display:grid;grid-template-columns:44px 1fr;background:#080b10}.lines{padding:12px 8px;text-align:right;white-space:pre;color:#465160;line-height:24px;font-size:13px;border-right:1px solid #141922}.editor{width:100%;min-height:260px;resize:vertical;border:0;outline:0;background:#080b10;color:#d7dde8;padding:12px 14px;font:13px/24px ui-monospace,monospace;tab-size:4}.actions{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px;background:#0d1117;border-block:1px solid var(--line)}button.action{min-height:40px;padding:0 14px;border:1px solid #303846;background:#151a22;color:#dce3ed;font:12px inherit;cursor:pointer}.run{color:var(--green)!important;border-color:#236c42!important}.check{color:#82bfff!important;border-color:#285d8d!important}.bottom{display:grid;grid-template-columns:1fr 1fr}.pane{padding:12px 14px;min-height:150px}.pane:first-child{border-right:1px solid var(--line)}.paneHead{font-size:11px;color:#8d98a8;border-bottom:1px solid var(--line);padding-bottom:7px}.out{white-space:pre-wrap;font-size:12px;line-height:1.6;margin-top:9px}.good{color:var(--green)}.bad{color:var(--red)}.status{position:fixed;bottom:0;left:220px;right:0;padding:5px 10px;background:#10151c;border-top:1px solid var(--line);font-size:10px;color:#778292}.status b{color:var(--blue)}@media(max-width:650px){.layout{grid-template-columns:1fr}.head{display:none}aside{border-right:0;border-bottom:1px solid var(--line)}#files{display:flex;overflow-x:auto}.file{width:auto;min-width:max-content;border-left:0;border-bottom:2px solid transparent}.file.active{border-bottom-color:var(--blue)}.bottom{grid-template-columns:1fr}.pane:first-child{border-right:0;border-bottom:1px solid var(--line)}.status{position:static}.layout{min-height:0}}
</style></head><body>
<header class="top"><div class="logo">Code<b>World</b></div><div class="path">python / lessons / <span id="pathName"></span></div></header>
<div class="layout"><aside><div class="head">EXPLORER · PYTHON</div><div id="files"></div></aside><main><div class="tab"><span>◆</span><b id="tabName"></b></div><section class="lesson"><div id="lessonNum" class="comment"></div><div id="lessonTitle" class="title"></div><div id="lessonDesc" class="desc"></div><div id="task" class="task"></div></section><div class="editorWrap"><div id="lines" class="lines">1</div><textarea id="editor" class="editor" spellcheck="false"></textarea></div><div class="actions"><button class="action run" id="run">▶ RUN</button><button class="action check" id="check">✓ CHECK</button><button class="action" id="hint">HINT</button><button class="action" id="reset">RESET</button></div><div class="bottom"><section class="pane"><div class="paneHead">TERMINAL</div><div id="output" class="out"></div></section><section class="pane"><div class="paneHead">CODEWORLD TEACHER</div><div id="feedback" class="out"></div></section></div><div class="status"><b>Python</b> · Learning Mode · Spaces: 4 · UTF-8</div></main></div>
<script>
const lessons=[
['01_print.py','Printing','print() tells Python to display something. Text goes inside quotes.','# TASK: Print exactly: Hello, CodeWorld!','print("Hello, CodeWorld!")','Use print("your text")',c=>/print\s*\(\s*["\']Hello, CodeWorld!["\']\s*\)/.test(c)],
['02_variables.py','Variables','Variables give values a name so your program can store and reuse information.','# TASK: Store "CodeWorld" in a variable named game, then print it.','game = "CodeWorld"\nprint(game)','game = "CodeWorld"',c=>/game\s*=\s*["\']CodeWorld["\']/.test(c)&&/print\s*\(\s*game\s*\)/.test(c)],
['03_math.py','Numbers + Math','Python can calculate with +, -, *, and /. Numbers do not need quotation marks.','# TASK: Set score to 10 + 5, then print score.','score = 10 + 5\nprint(score)','score = 10 + 5',c=>/score\s*=\s*10\s*\+\s*5/.test(c)&&/print\s*\(\s*score\s*\)/.test(c)],
['04_input.py','Player Input','input() lets a player type something into your program and save the answer.','# TASK: Ask for a name and save the answer as name.','name = input("What is your name? ")\nprint(name)','name = input("...")',c=>/name\s*=\s*input\s*\(/.test(c)],
['05_if.py','If Statements','if lets your program choose what happens based on whether a condition is true.','# TASK: If age is at least 10, print "You can play!"','age = 12\n\nif age >= 10:\n    print("You can play!")','if age >= 10:',c=>/if\s+age\s*>=\s*10\s*:/.test(c)&&/You can play!/.test(c)],
['06_loops.py','Loops','Loops repeat code without making you write the same line again and again.','# TASK: Use range(3) to print Hello three times.','for i in range(3):\n    print("Hello")','for i in range(3):',c=>/for\s+\w+\s+in\s+range\s*\(\s*3\s*\)\s*:/.test(c)],
['07_functions.py','Functions','Functions package code into reusable commands you can call whenever you need them.','# TASK: Make greet() print Hello, then call greet().','def greet():\n    print("Hello")\n\ngreet()','def greet():',c=>/def\s+greet\s*\(\s*\)\s*:/.test(c)&&(c.match(/greet\s*\(\s*\)/g)||[]).length>=2],
['08_lists.py','Lists','Lists store multiple pieces of information together inside square brackets.','# TASK: Make pets contain Cat, Dog, and Dragon, then print pets.','pets = ["Cat", "Dog", "Dragon"]\nprint(pets)','pets = ["Cat", "Dog", "Dragon"]',c=>/pets\s*=\s*\[[\s\S]*Cat[\s\S]*Dog[\s\S]*Dragon[\s\S]*\]/.test(c)&&/print\s*\(\s*pets\s*\)/.test(c)]];
let active=0;const $=id=>document.getElementById(id),editor=$('editor');function nums(){ $('lines').textContent=Array.from({length:Math.max(1,editor.value.split('\n').length)},(_,i)=>i+1).join('\n')}function nav(){files.innerHTML='';lessons.forEach((l,i)=>{let b=document.createElement('button');b.className='file'+(i===active?' active':'');b.innerHTML='<span>◆</span>'+l[0];b.onclick=()=>load(i);files.appendChild(b)})}function load(i){active=i;let l=lessons[i];pathName.textContent=tabName.textContent=l[0];lessonNum.textContent='# Lesson '+String(i+1).padStart(2,'0');lessonTitle.textContent=l[1];lessonDesc.textContent=l[2];task.textContent=l[3];editor.value=l[4];output.textContent='$ python '+l[0]+'\n';feedback.textContent='// Edit the code, then press CHECK.';feedback.className='out';nums();nav()}function preview(c){let r=[],v={};for(let raw of c.split('\n')){let s=raw.trim(),m=s.match(/^(\w+)\s*=\s*["']([^"']*)["']$/);if(m){v[m[1]]=m[2];continue}m=s.match(/^(\w+)\s*=\s*(\d+)\s*\+\s*(\d+)$/);if(m){v[m[1]]=+m[2]+ +m[3];continue}m=s.match(/^print\((.*)\)$/);if(m){let x=m[1].trim();if(/^['"].*['"]$/.test(x))x=x.slice(1,-1);else if(x in v)x=v[x];r.push(x)}}return r.length?r.join('\n'):'[preview] Run preview supports basic print, variables, and simple math.'}editor.oninput=nums;editor.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();editor.setRangeText('    ',editor.selectionStart,editor.selectionEnd,'end');nums()}};run.onclick=()=>output.textContent='$ python '+lessons[active][0]+'\n'+preview(editor.value);check.onclick=()=>{let ok=lessons[active][6](editor.value);feedback.textContent=ok?'✓ PASS\nYour code completes this lesson.':'✗ NOT YET\nCheck your code or press HINT.';feedback.className='out '+(ok?'good':'bad')};hint.onclick=()=>{feedback.textContent='// HINT\n'+lessons[active][5];feedback.className='out'};reset.onclick=()=>load(active);load(0);
</script></body></html>
